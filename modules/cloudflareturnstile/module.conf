<module name="cloudflareturnstile">

  <pages>
    <page name="cloudflareturnstile_config"
          title="Cloudflare Turnstile"
          class="CloudflareTurnstileConfigPage"
          class_file="modules/cloudflareturnstile/pages/CloudflareTurnstileConfigPage.class.php"
          parent="modules"
          url="manager_content.php?page=cloudflareturnstile_config">
      <templates>
        <template name="default" file="cloudflareturnstile_ConfigPage.tpl"/>
      </templates>
    </page>
  </pages>

  <forms>
    <form name="cloudflareturnstile_config" page="cloudflareturnstile_config" method="POST">
      <fields>
        <field name="site_key"
               widget="text"
               description="[CLOUDFLARE_TURNSTILE_SITE_KEY]"
               validator="text"
               max_length="255"/>
        <field name="secret_key"
               widget="password"
               description="[CLOUDFLARE_TURNSTILE_SECRET_KEY]"
               validator="text"
               max_length="255"/>
        <field name="save"
               widget="submit"
               description="[SAVE]"
               validator="submit"/>
      </fields>
    </form>
  </forms>

</module>
