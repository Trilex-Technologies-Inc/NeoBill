<module name="ups">

  <pages>
    <page name="ups_config"
          title="UPS Shipping"
          class="UPSConfigPage"
          class_file="modules/ups/pages/UPSConfigPage.class.php"
          parent="modules"
          url="manager_content.php?page=ups_config">
      <templates>
        <template name="default" file="ups_ConfigPage.tpl"/>
      </templates>
    </page>
  </pages>

  <forms>
    <form name="ups_config" page="ups_config" type="POST">
      <fields>
        <field name="mode"
               widget="select"
               description="[UPS_MODE]"
               validator="choice"
               required="true">
          <enum>
            <option value="sandbox" description="Sandbox"/>
            <option value="live" description="Live"/>
          </enum>
        </field>
        <field name="client_id"
               widget="text"
               description="[UPS_CLIENT_ID]"
               min_length="0"
               max_length="255"
               validator="text"/>
        <field name="client_secret"
               widget="password"
               description="[UPS_CLIENT_SECRET]"
               min_length="0"
               max_length="255"
               validator="text"/>
        <field name="shipper_number"
               widget="text"
               description="[UPS_SHIPPER_NUMBER]"
               min_length="0"
               max_length="32"
               validator="text"/>
        <field name="account_country"
               widget="text"
               description="[UPS_ACCOUNT_COUNTRY]"
               min_length="0"
               max_length="2"
               validator="text"/>
        <field name="account_postal_code"
               widget="text"
               description="[UPS_ACCOUNT_POSTAL_CODE]"
               min_length="0"
               max_length="20"
               validator="text"/>
        <field name="currency"
               widget="select"
               description="[UPS_CURRENCY]"
               validator="choice"
               required="true">
          <enum>
            <option value="CAD" description="Canadian Dollar"/>
            <option value="EUR" description="Euro"/>
            <option value="GBP" description="Pound Sterling"/>
            <option value="USD" description="United States Dollar"/>
          </enum>
        </field>
        <field name="default_service_code"
               widget="select"
               description="[UPS_DEFAULT_SERVICE]"
               validator="choice"
               required="true">
          <enum>
            <option value="01" description="UPS Next Day Air"/>
            <option value="02" description="UPS 2nd Day Air"/>
            <option value="03" description="UPS Ground"/>
            <option value="07" description="UPS Worldwide Express"/>
            <option value="08" description="UPS Worldwide Expedited"/>
            <option value="11" description="UPS Standard"/>
            <option value="12" description="UPS 3 Day Select"/>
            <option value="13" description="UPS Next Day Air Saver"/>
            <option value="14" description="UPS Next Day Air Early"/>
            <option value="54" description="UPS Worldwide Express Plus"/>
            <option value="65" description="UPS Saver"/>
          </enum>
        </field>
        <field name="default_packaging_code"
               widget="select"
               description="[UPS_DEFAULT_PACKAGING]"
               validator="choice"
               required="true">
          <enum>
            <option value="02" description="Package"/>
            <option value="01" description="UPS Letter"/>
            <option value="03" description="Tube"/>
            <option value="04" description="Pak"/>
            <option value="21" description="UPS Express Box"/>
            <option value="24" description="UPS 25KG Box"/>
            <option value="25" description="UPS 10KG Box"/>
          </enum>
        </field>
        <field name="weight_unit"
               widget="select"
               description="[UPS_WEIGHT_UNIT]"
               validator="choice"
               required="true">
          <enum>
            <option value="LBS" description="Pounds"/>
            <option value="KGS" description="Kilograms"/>
          </enum>
        </field>
        <field name="dimension_unit"
               widget="select"
               description="[UPS_DIMENSION_UNIT]"
               validator="choice"
               required="true">
          <enum>
            <option value="IN" description="Inches"/>
            <option value="CM" description="Centimeters"/>
          </enum>
        </field>
        <field name="save"
               widget="submit"
               description="[SAVE]"
               validator="submit"/>
      </fields>
    </form>
  </forms>

</module>
