<module name="stripe">

  <pages>
    <page name="stripe_config"
          title="Stripe"
          class="StripeConfigPage"
          class_file="modules/stripe/pages/StripeConfigPage.class.php"
          parent="modules"
          url="manager_content.php?page=stripe_config">
      <templates>
        <template name="default" file="stripe_ConfigPage.tpl"/>
      </templates>
    </page>

    <page name="stripe_checkout"
          title="Stripe Checkout"
          class="StripeCheckoutPage"
          class_file="modules/stripe/pages/StripeCheckoutPage.class.php"
          url="index.php?page=stripe_checkout">
      <templates>
        <template name="default" file="stripe_CheckoutPage.tpl"/>
      </templates>
    </page>

    <page name="stripe_return"
          title="Stripe Return"
          class="StripeReturnPage"
          class_file="modules/stripe/pages/StripeReturnPage.class.php"
          url="index.php?page=stripe_return">
      <templates>
        <template name="default" file="stripe_ReturnPage.tpl"/>
      </templates>
    </page>
  </pages>

  <forms>
    <form name="stripe_config" page="stripe_config" type="POST">
      <fields>
        <field name="mode"
               widget="select"
               description="[STRIPE_MODE]"
               validator="choice"
               required="true">
          <enum>
            <option value="test" description="Test"/>
            <option value="live" description="Live"/>
          </enum>
        </field>
        <field name="test_publishable_key"
               widget="text"
               description="[STRIPE_TEST_PUBLISHABLE_KEY]"
               min_length="0"
               max_length="255"
               validator="text"/>
        <field name="test_secret_key"
               widget="password"
               description="[STRIPE_TEST_SECRET_KEY]"
               min_length="0"
               max_length="255"
               validator="text"/>
        <field name="live_publishable_key"
               widget="text"
               description="[STRIPE_LIVE_PUBLISHABLE_KEY]"
               min_length="0"
               max_length="255"
               validator="text"/>
        <field name="live_secret_key"
               widget="password"
               description="[STRIPE_LIVE_SECRET_KEY]"
               min_length="0"
               max_length="255"
               validator="text"/>
        <field name="currency"
               widget="select"
               description="[STRIPE_CURRENCY]"
               validator="choice"
               required="true">
          <enum>
            <option value="AUD" description="Australian Dollar"/>
            <option value="CAD" description="Canadian Dollar"/>
            <option value="EUR" description="Euro"/>
            <option value="GBP" description="Pound Sterling"/>
            <option value="JPY" description="Japanese Yen"/>
            <option value="USD" description="United States Dollar"/>
          </enum>
        </field>
        <field name="save"
               widget="submit"
               description="[SAVE]"
               validator="submit"/>
      </fields>
    </form>

    <form name="stripe_checkout" page="stripe_checkout" type="POST">
      <fields>
        <field name="pay"
               widget="submit"
               description="[PAY_WITH_STRIPE_BUTTON]"
               validator="submit"/>
        <field name="back"
               widget="submit"
               description="[BACK]"
               validator="submit"/>
        <field name="startover"
               widget="submit"
               description="[STARTOVER]"
               validator="submit"/>
      </fields>
    </form>
  </forms>

</module>
