<module name="subscriptionmanager">

  <pages>
    <page name="subscriptionmanager_config"
          title="Subscription Manager"
          class="SubscriptionManagerConfigPage"
          class_file="modules/subscriptionmanager/pages/SubscriptionManagerConfigPage.class.php"
          parent="modules"
          url="manager_content.php?page=subscriptionmanager_config">
      <templates>
        <template name="default" file="subscriptionmanager_ConfigPage.tpl"/>
      </templates>
    </page>
    <page name="subscriptionmanager_plans"
          title="Subscription Plans"
          class="SubscriptionManagerPlansPage"
          class_file="modules/subscriptionmanager/pages/SubscriptionManagerPlansPage.class.php"
          parent="modules"
          url="manager_content.php?page=subscriptionmanager_plans">
      <templates>
        <template name="default" file="subscriptionmanager_PlansPage.tpl"/>
      </templates>
    </page>
    <page name="subscriptionmanager_subscriptions"
          title="Subscriptions"
          class="SubscriptionManagerSubscriptionsPage"
          class_file="modules/subscriptionmanager/pages/SubscriptionManagerSubscriptionsPage.class.php"
          parent="modules"
          url="manager_content.php?page=subscriptionmanager_subscriptions">
      <templates>
        <template name="default" file="subscriptionmanager_SubscriptionsPage.tpl"/>
      </templates>
    </page>
    <page name="subscriptionmanager_usage"
          title="Record Usage"
          class="SubscriptionManagerUsagePage"
          class_file="modules/subscriptionmanager/pages/SubscriptionManagerUsagePage.class.php"
          parent="modules"
          url="manager_content.php?page=subscriptionmanager_usage">
      <templates>
        <template name="default" file="subscriptionmanager_UsagePage.tpl"/>
      </templates>
    </page>
    <page name="subscriptionmanager_billing"
          title="Run Subscription Billing"
          class="SubscriptionManagerBillingPage"
          class_file="modules/subscriptionmanager/pages/SubscriptionManagerBillingPage.class.php"
          parent="modules"
          url="manager_content.php?page=subscriptionmanager_billing">
      <templates>
        <template name="default" file="subscriptionmanager_BillingPage.tpl"/>
      </templates>
    </page>
    <page name="subscriptionmanager_dunning"
          title="Dunning Queue"
          class="SubscriptionManagerDunningPage"
          class_file="modules/subscriptionmanager/pages/SubscriptionManagerDunningPage.class.php"
          parent="modules"
          url="manager_content.php?page=subscriptionmanager_dunning">
      <templates>
        <template name="default" file="subscriptionmanager_DunningPage.tpl"/>
      </templates>
    </page>
  </pages>

  <forms>
    <form name="subscriptionmanager_config" page="subscriptionmanager_config" method="POST">
      <fields>
        <field name="invoice_terms"
               description="[SUBSCRIPTION_MANAGER_INVOICE_TERMS]"
               widget="text"
               required="true"
               validator="int"
               min="0"
               max="365"/>
        <field name="retry_schedule"
               description="[SUBSCRIPTION_MANAGER_RETRY_SCHEDULE]"
               widget="text"
               required="true"
               validator="text"
               max_length="255"/>
        <field name="failed_payment_subject"
               description="[SUBSCRIPTION_MANAGER_FAILED_PAYMENT_SUBJECT]"
               widget="text"
               required="true"
               validator="text"
               max_length="255"/>
        <field name="failed_payment_email"
               description="[SUBSCRIPTION_MANAGER_FAILED_PAYMENT_EMAIL]"
               widget="textarea"
               required="true"
               validator="text"
               max_length="65535"/>
        <field name="card_update_url"
               description="[SUBSCRIPTION_MANAGER_CARD_UPDATE_URL]"
               widget="text"
               required="false"
               validator="text"
               max_length="255"/>
        <field name="save"
               description="[SAVE]"
               widget="submit"
               validator="submit"/>
      </fields>
    </form>
    <form name="subscriptionmanager_plan_create" page="subscriptionmanager_plans" method="POST">
      <fields>
        <field name="name" description="[SUBSCRIPTION_MANAGER_PLAN_NAME]" widget="text" required="true" validator="text" max_length="255"/>
        <field name="description" description="[DESCRIPTION]" widget="textarea" required="false" validator="text" max_length="65535"/>
        <field name="billing_type" description="[SUBSCRIPTION_MANAGER_BILLING_TYPE]" widget="select" required="true" validator="choice">
          <enum>
            <option value="fixed" description="Fixed" default="true"/>
            <option value="usage" description="Usage"/>
          </enum>
        </field>
        <field name="billing_cycle" description="[SUBSCRIPTION_MANAGER_BILLING_CYCLE]" widget="select" required="true" validator="choice">
          <enum>
            <option value="daily" description="Daily"/>
            <option value="weekly" description="Weekly"/>
            <option value="monthly" description="Monthly" default="true"/>
            <option value="annually" description="Annually"/>
          </enum>
        </field>
        <field name="cycle_interval" description="[SUBSCRIPTION_MANAGER_CYCLE_INTERVAL]" widget="text" required="true" validator="int" min="1" max="365"/>
        <field name="amount" description="[SUBSCRIPTION_MANAGER_AMOUNT]" widget="text" required="true" validator="float"/>
        <field name="included_quantity" description="[SUBSCRIPTION_MANAGER_INCLUDED_QUANTITY]" widget="text" required="true" validator="float"/>
        <field name="unit_amount" description="[SUBSCRIPTION_MANAGER_UNIT_AMOUNT]" widget="text" required="true" validator="float"/>
        <field name="trial_days" description="[SUBSCRIPTION_MANAGER_TRIAL_DAYS]" widget="text" required="true" validator="int" min="0" max="3650"/>
        <field name="intro_amount" description="[SUBSCRIPTION_MANAGER_INTRO_AMOUNT]" widget="text" required="false" validator="float"/>
        <field name="intro_cycles" description="[SUBSCRIPTION_MANAGER_INTRO_CYCLES]" widget="text" required="true" validator="int" min="0" max="365"/>
        <field name="taxable" description="[TAXABLE]" widget="select" required="true" validator="choice">
          <enum>
            <option value="No" description="[NO]" default="true"/>
            <option value="Yes" description="[YES]"/>
          </enum>
        </field>
        <field name="save" description="[SAVE]" widget="submit" validator="submit"/>
      </fields>
    </form>
    <form name="subscriptionmanager_subscription_create" page="subscriptionmanager_subscriptions" method="POST">
      <fields>
        <field name="accountid" description="[ACCOUNT]" widget="text" required="true" validator="int"/>
        <field name="planid" description="[SUBSCRIPTION_MANAGER_PLAN_ID]" widget="text" required="true" validator="int"/>
        <field name="priceid" description="[SUBSCRIPTION_MANAGER_PRICE_ID]" widget="text" required="true" validator="int"/>
        <field name="quantity" description="[QUANTITY]" widget="text" required="true" validator="int" min="1" max="999999"/>
        <field name="status" description="[STATUS]" widget="select" required="true" validator="choice">
          <enum>
            <option value="trialing" description="Trialing"/>
            <option value="active" description="Active" default="true"/>
            <option value="past_due" description="Past Due"/>
            <option value="paused" description="Paused"/>
            <option value="cancelled" description="Cancelled"/>
          </enum>
        </field>
        <field name="start_date" description="[SUBSCRIPTION_MANAGER_START_DATE]" widget="date" required="true" validator="date"/>
        <field name="save" description="[SAVE]" widget="submit" validator="submit"/>
      </fields>
    </form>
    <form name="subscriptionmanager_usage_record" page="subscriptionmanager_usage" method="POST">
      <fields>
        <field name="subscriptionid" description="[SUBSCRIPTION_MANAGER_SUBSCRIPTION_ID]" widget="text" required="true" validator="int"/>
        <field name="quantity" description="[QUANTITY]" widget="text" required="true" validator="float"/>
        <field name="description" description="[DESCRIPTION]" widget="text" required="false" validator="text" max_length="255"/>
        <field name="usage_date" description="[DATE]" widget="date" required="true" validator="date"/>
        <field name="save" description="[SAVE]" widget="submit" validator="submit"/>
      </fields>
    </form>
    <form name="subscriptionmanager_run_billing" page="subscriptionmanager_billing" method="POST">
      <fields>
        <field name="billing_date" description="[SUBSCRIPTION_MANAGER_BILLING_DATE]" widget="date" required="true" validator="date"/>
        <field name="run" description="[SUBSCRIPTION_MANAGER_RUN_BILLING]" widget="submit" validator="submit"/>
      </fields>
    </form>
    <form name="subscriptionmanager_schedule_dunning" page="subscriptionmanager_dunning" method="POST">
      <fields>
        <field name="subscriptionid" description="[SUBSCRIPTION_MANAGER_SUBSCRIPTION_ID]" widget="text" required="true" validator="int"/>
        <field name="invoiceid" description="[INVOICE]" widget="text" required="true" validator="int"/>
        <field name="save" description="[SUBSCRIPTION_MANAGER_SCHEDULE_DUNNING]" widget="submit" validator="submit"/>
      </fields>
    </form>
  </forms>

</module>
