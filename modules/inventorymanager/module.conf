<module name="inventorymanager">
  <pages>
    <page name="inventorymanager_items" title="Inventory Items" class="InventoryManagerItemsPage" class_file="modules/inventorymanager/pages/InventoryManagerItemsPage.class.php" parent="modules" url="manager_content.php?page=inventorymanager_items">
      <templates><template name="default" file="inventorymanager_ItemsPage.tpl"/></templates>
    </page>
    <page name="inventorymanager_locations" title="Inventory Locations" class="InventoryManagerLocationsPage" class_file="modules/inventorymanager/pages/InventoryManagerLocationsPage.class.php" parent="modules" url="manager_content.php?page=inventorymanager_locations">
      <templates><template name="default" file="inventorymanager_LocationsPage.tpl"/></templates>
    </page>
    <page name="inventorymanager_bundles" title="Inventory Bundles" class="InventoryManagerBundlesPage" class_file="modules/inventorymanager/pages/InventoryManagerBundlesPage.class.php" parent="modules" url="manager_content.php?page=inventorymanager_bundles">
      <templates><template name="default" file="inventorymanager_BundlesPage.tpl"/></templates>
    </page>
    <page name="inventorymanager_adjustments" title="Inventory Adjustments" class="InventoryManagerAdjustmentsPage" class_file="modules/inventorymanager/pages/InventoryManagerAdjustmentsPage.class.php" parent="modules" url="manager_content.php?page=inventorymanager_adjustments">
      <templates><template name="default" file="inventorymanager_AdjustmentsPage.tpl"/></templates>
    </page>
    <page name="inventorymanager_alerts" title="Inventory Alerts" class="InventoryManagerAlertsPage" class_file="modules/inventorymanager/pages/InventoryManagerAlertsPage.class.php" parent="modules" url="manager_content.php?page=inventorymanager_alerts">
      <templates><template name="default" file="inventorymanager_AlertsPage.tpl"/></templates>
    </page>
  </pages>

  <forms>
    <form name="inventorymanager_item_create" page="inventorymanager_items" method="POST">
      <fields>
        <field name="sku" description="[INVENTORY_MANAGER_SKU]" widget="text" required="true" validator="text" max_length="64"/>
        <field name="name" description="[NAME]" widget="text" required="true" validator="text" max_length="255"/>
        <field name="description" description="[DESCRIPTION]" widget="textarea" required="false" validator="text" max_length="65535"/>
        <field name="item_type" description="[INVENTORY_MANAGER_ITEM_TYPE]" widget="select" required="true" validator="choice">
          <enum>
            <option value="physical" description="Physical" default="true"/>
            <option value="service" description="Service"/>
            <option value="variant" description="Variant"/>
            <option value="bundle" description="Bundle"/>
          </enum>
        </field>
        <field name="parent_itemid" description="[INVENTORY_MANAGER_PARENT_ITEM_ID]" widget="text" required="false" validator="int"/>
        <field name="reorder_threshold" description="[INVENTORY_MANAGER_REORDER_THRESHOLD]" widget="text" required="true" validator="int" min="0" max="999999"/>
        <field name="save" description="[SAVE]" widget="submit" validator="submit"/>
      </fields>
    </form>
    <form name="inventorymanager_item_update" page="inventorymanager_items" method="POST">
      <fields>
        <field name="itemid" description="[INVENTORY_MANAGER_ITEM_ID]" widget="text" required="true" validator="int"/>
        <field name="sku" description="[INVENTORY_MANAGER_SKU]" widget="text" required="true" validator="text" max_length="64"/>
        <field name="name" description="[NAME]" widget="text" required="true" validator="text" max_length="255"/>
        <field name="description" description="[DESCRIPTION]" widget="textarea" required="false" validator="text" max_length="65535"/>
        <field name="item_type" description="[INVENTORY_MANAGER_ITEM_TYPE]" widget="select" required="true" validator="choice">
          <enum>
            <option value="physical" description="Physical" default="true"/>
            <option value="service" description="Service"/>
            <option value="variant" description="Variant"/>
            <option value="bundle" description="Bundle"/>
          </enum>
        </field>
        <field name="parent_itemid" description="[INVENTORY_MANAGER_PARENT_ITEM_ID]" widget="text" required="false" validator="int"/>
        <field name="reorder_threshold" description="[INVENTORY_MANAGER_REORDER_THRESHOLD]" widget="text" required="true" validator="int" min="0" max="999999"/>
        <field name="status" description="[STATUS]" widget="select" required="true" validator="choice">
          <enum>
            <option value="active" description="Active" default="true"/>
            <option value="archived" description="Archived"/>
          </enum>
        </field>
        <field name="save" description="[SAVE]" widget="submit" validator="submit"/>
      </fields>
    </form>
    <form name="inventorymanager_item_delete" page="inventorymanager_items" method="POST">
      <fields>
        <field name="itemid" description="[INVENTORY_MANAGER_ITEM_ID]" widget="text" required="true" validator="int"/>
        <field name="delete" description="[DELETE]" widget="submit" validator="submit"/>
      </fields>
    </form>
    <form name="inventorymanager_product_map_create" page="inventorymanager_items" method="POST">
