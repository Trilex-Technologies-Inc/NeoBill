    <form name="inventorymanager_stock_update" page="inventorymanager_adjustments" method="POST">
      <fields>
        <field name="stockid" description="Stock ID" widget="text" required="true" validator="int"/>
        <field name="itemid" description="[INVENTORY_MANAGER_ITEM_ID]" widget="text" required="true" validator="int"/>
        <field name="locationid" description="[INVENTORY_MANAGER_LOCATION_ID]" widget="text" required="true" validator="int"/>
        <field name="quantity" description="[QUANTITY]" widget="text" required="true" validator="int" min="-999999" max="999999"/>
